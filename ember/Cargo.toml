[workspace]
resolver = "2"
members = ["crates/ember-core", "crates/ember-cli", "crates/ember-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
xattr = { path = "patches/xattr" }

[profile.dev]
debug = 0
