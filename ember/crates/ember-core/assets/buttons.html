<div class="icon-cluster">
<button class="btn-del" title="Delete entry" onclick="deleteRow(this)"><svg class="icon hi" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
<button class="btn-in" title="Copy header (shift = header + content)" onclick="copyInput(this,event)"><svg class="icon hi" viewBox="0 0 24 24"><use href="#i-ch"/></svg></button>
<button class="btn-out" title="Copy content (shift = header + content)" onclick="copyOutput(this,event)"><svg class="icon hi" viewBox="0 0 24 24"><use href="#i-cc"/></svg></button>
<button class="btn-fold" title="Collapse output" onclick="toggleOutput(this)"><svg class="icon hi" viewBox="0 0 24 24"><use class="pm-v" href="#i-v"/><use href="#i-h"/></svg></button>
</div>
