<!DOCTYPE html>
<html lang="en" class="cast-root" data-accent="1A05A2">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>@@TITLE@@</title>
<link rel="icon" type="image/svg+xml" href="@@FAVICON@@"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --font-mono: 'JetBrains Mono Light', 'Cascadia Code Light', 'Roboto Mono Light';
  --ink: #000000;
  --paper: #ffffff;
  
  --accent: #FF8383; 
  --gutter: 40px; 
  --sidebar-w: 300px; 
}

[data-accent="FF8383"] { --accent: #FF8383; }
[data-accent="FCD3FF"] { --accent: #FCD3FF; }
[data-accent="29AA99"] { --accent: #29AA99; }
[data-accent="15D8B3"] { --accent: #15D8B3; }
[data-accent="7692FF"] { --accent: #7692FF; }
[data-accent="1A05A2"] { --accent: #1A05A2; }

a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
input { font-family: inherit; }

html.cast-root { background: var(--ink); }
body {
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  border: 8px solid var(--ink);
}



html { scrollbar-width: none; } 
html::-webkit-scrollbar { display: none; } 

aside::-webkit-scrollbar { width: 6px; }
aside::-webkit-scrollbar-track { background: transparent; border-left: 0; }
aside::-webkit-scrollbar-thumb { background: var(--ink); border: 0; min-height: 0; }


.scroll-rail { position: fixed; top: 0; right: 16px; width: 14px; height: 100vh; pointer-events: auto; z-index: 2000; cursor: pointer; }
.scroll-thumb { position: absolute; top: 0; left: 1px; right: 1px; min-height: 48px; border-radius: 6px; border: 2px solid var(--ink); cursor: grab; background: linear-gradient(180deg, var(--ink) 0%, var(--paper) 50%, var(--ink) 100%); background-size: 100% 300%; animation: thumb-slide 6s linear infinite; }
@keyframes thumb-slide {
  0% { background-position: 0% 0%; }
  100% { background-position: 0% 100%; }
}

.icon { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }


/* [2026-10-19 PDT] Header (final2): identity row / framed context deck / toolbar row. Spacing only, no rules. */
header { display: flex; flex-direction: column; gap: 28px; width: 100%; padding: 28px 0 16px; background: var(--ink); color: var(--paper); border-bottom: 6px solid var(--ink); }
.hdr-top { display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; gap: 14px 32px; width: 100%; padding: 0 var(--gutter); }
.hdr-brand { grid-area: 1 / 1; display: flex; align-items: baseline; gap: 16px; min-width: 0; }
.hdr-brand .icon { width: 32px; height: 32px; align-self: center; }
.hdr-title { font-size: 34px; font-weight: 600; line-height: 1.15; letter-spacing: .03em; text-transform: none; overflow-wrap: break-word; min-width: 0; }
.meta-time { display: flex; flex-wrap: wrap; column-gap: 2ch; grid-area: 1 / 1; justify-self: end; align-self: end; background: var(--paper); color: var(--ink); border: 2px solid var(--paper); padding: 10.8px 10px 7.8px; font-size: 17px; font-weight: 300; line-height: 1; letter-spacing: .02em; text-transform: uppercase; position: relative; top: -8.6px; } /* caps optically centred: line-height 1, asymmetric 10.8 / 7.8 (6px 10px feel; 39.6px tall); top:-8.6px puts the bottom border's outer edge on the target baseline (measured, 34px title) */
.meta-time > span:first-child, .meta-time-spacer > span > span:first-child { font-weight: 600; }
/* [2026-10-19 PDT] v2 title: small dim script label, baseline-aligned before the large target (no colon). */
.hdr-script { margin-right: .7em; font-size: 14px; font-weight: 300; letter-spacing: .08em; text-transform: uppercase; color: var(--paper); }
.hdr-target { overflow-wrap: anywhere; }
.hdr-deck { display: flex; flex-direction: column; gap: 10px; margin: 0 var(--gutter); border: 2px solid var(--paper); padding: 16px; }
.hdr-meta, .hdr-stats { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; }
.hdr-meta .kv { --pf: var(--ink); --pi: var(--paper); }
.hdr-stats .kv { --pf: var(--paper); --pi: var(--ink); }
.kv { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; max-width: 100%; background: var(--pf); color: var(--pi); border: 2px solid var(--paper); padding: 6px 10px; line-height: 1.3; }
.kv .k { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
.kv .v { font-size: 12px; font-weight: 300; overflow-wrap: anywhere; }
.kv .v.path { word-break: break-all; }
/* Title row: the date pill shares the title's grid cell, pinned bottom-right, so it sits on the title's
   LAST line. An invisible copy at the end of the title text (.meta-time-spacer) reserves the pill's width
   and height (39.6px = 17px x 1 + 10.8px + 7.8px + 2 x 2px border, centred on the title line) on that line; if the last line has no room, the spacer wraps and the pill drops below. */
.meta-time-spacer { display: inline-block; visibility: hidden; margin-left: 32px; padding: calc((39.6px - 1.15em) / 2) 0; vertical-align: baseline; }
.meta-time-spacer > span { display: inline-block; height: 0; overflow: hidden; padding: 0 12px; font-size: 17px; font-weight: 300; letter-spacing: .02em; text-transform: uppercase; vertical-align: baseline; }
.meta-time-spacer > span > span + span { margin-left: 2ch; }
/* Toolbar row: right edge = row icon cluster (row border 2px + row-hd padding 12px). */
.hdr-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-top: -8px; padding: 0 calc(var(--gutter) + 14px) 0 var(--gutter); }


main { display: flex; align-items: flex-start; width: 100%; background: var(--paper); }


aside {
  width: var(--sidebar-w, 300px); 
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  overflow-y: auto;
  border-right: 3px solid var(--ink);
  background: var(--paper);
}
.toc-search { width: 100%; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 8px 12px; font-family: var(--font-mono); font-size: 13px; outline: none; }
.toc-search::placeholder { color: var(--ink); }
nav.toc { display: flex; flex-direction: column; gap: 8px; }
nav.toc a { display: block; width: 100%; padding: 8px 12px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); font-size: 13px; font-weight: 300; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .12s, color .12s; }
nav.toc a:hover { background: var(--ink); color: var(--paper); }
nav.toc a.active { background: var(--ink); color: var(--paper); }

/* [2026-10-04 PDT] Wrapped bottom grid: hover, focus, and current part are visible. */
/* [2026-10-15 PDT] One centered, rigid grid: no gaps or recentered partial rows. */
.parts { display:grid; grid-template-columns:repeat(var(--part-columns),48px); grid-auto-rows:40px; justify-content:center; gap:0; width:100%; padding:24px var(--gutter); border-top:3px solid var(--ink); background:var(--paper); }
/* [2026-10-19 PDT] Each shared edge is drawn once: uniform 1px lines.
   Rows remain rigid, gapless and capped at ten; all states are monochrome. */
.parts a { display:flex; align-items:center; justify-content:center; width:48px; height:40px; padding:0; border:0; border-right:1px solid var(--ink); border-bottom:1px solid var(--ink); background:var(--paper); color:var(--ink); font-size:13px; font-weight:700; transition:background .12s,color .12s; box-shadow:none; outline:none; }
.parts a:nth-child(-n+10) {border-top:1px solid var(--ink);}
.parts a:nth-child(10n+1) {border-left:1px solid var(--ink);}
.parts a:hover,.parts a:focus-visible {background:var(--ink);color:var(--paper);}
.parts a.current {background:var(--ink);color:var(--paper);box-shadow:none;}
.parts a.current:hover {background:var(--paper);color:var(--ink);}
.render-block {display:block;content-visibility:auto;contain-intrinsic-size:auto 800px;}
.row-output {content-visibility:auto;contain-intrinsic-size:auto 400px;}



section.content { overflow-anchor:none; flex: 1 1 0%; min-width: 0; padding: var(--gutter); display: flex; flex-direction: column; gap: 24px; }

.row { overflow-anchor:none; display: flex; flex-direction: column; background: var(--paper); border: 2px solid var(--ink); scroll-margin-top: 8px; }

.icon-cluster { display: flex; flex-shrink: 0; gap: 2px; }
.icon-cluster button { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: currentColor; transition: background .12s, color .12s; }
.icon-cluster button:hover { background: var(--ink); color: var(--paper); }
.row.active .icon-cluster button:hover { background: var(--paper); color: var(--ink); }
.icon-cluster button.copied { background: var(--accent); color: var(--paper); }
.row.active .icon-cluster button.copied { background: var(--accent); color: var(--paper); }
.btn-del:hover { background: #c0392b !important; color: var(--paper) !important; }


.row-output { display: block; }
.out { padding: 20px 24px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--ink); }
.ln { display: block; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.out strong { font-weight: 700; color: var(--ink); }
.out .v { color: var(--accent); }

.out strong .v { color: inherit; }
.raw { display: none; }


/* [2026-10-19 PDT] Accent swatches parked small at the toolbar row's left; final home pending. */
.accent-switcher { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; opacity: .8; }
.accent-switcher__label { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--paper); margin-right: 4px; text-transform: uppercase; }
.accent-dot { width: 14px; height: 14px; border: 2px solid var(--paper); border-radius: 0; cursor: pointer; transition: transform .12s; } 
.accent-dot:hover { transform: scale(1.15); }
.accent-dot.active { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--paper); }


.hdr-controls { display: flex; gap: 5px; margin-left: auto; }
.hdr-controls button { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--paper); transition: background .12s, color .12s; }
.hdr-controls button:hover { background: var(--paper); color: var(--ink); }
.hdr-controls .fold-ic { transition: transform .15s; }
.hdr-controls button.collapsed .fold-ic { transform: rotate(-90deg); }


.btn-fold { margin-left: 6px; }
.btn-fold .fold-ic { transition: transform .15s; }
.icon-cluster button.saved { background: var(--accent); color: var(--paper); }


.row.collapsed .row-output { display: none; } 
.row.collapsed .btn-fold .fold-ic { transform: rotate(-90deg); }


.resizer { width: 6px; flex-shrink: 0; height: 100vh; position: sticky; top: 0; cursor: col-resize; background: var(--ink); }
.resizer:hover, .resizer.dragging { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }

@media (max-width: 720px) {
  main { display: block; }
  aside { width: auto; height: auto; position: static; border-right: 0; border-bottom: 3px solid var(--ink); }
  .resizer { display: none; } 
}

 width:min(100%,calc(20*40px + 2*var(--gutter) + 1px));margin:0 auto;padding:24px var(--gutter) 24px calc(var(--gutter) + 1px);box-sizing:border-box;border-top:0}

   One-line strip = path box = 52px: 16 + 20px line + 16. Selected (.active, same logic as the TOC highlight) = inverted

<script>
// [2026-11-08 PST] pristine copy of the page as delivered (before the TOC/layer build), so a delete can save a clean file.
let __src='';document.addEventListener('DOMContentLoaded',()=>{__src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;});
'use strict';
// [2026-10-04 PDT] Cache DOM handles. Scroll uses O(log n) reads and changes only two rows.
let rowNodes=[],linkNodes=[];
const rows=()=>rowNodes;const links=()=>linkNodes;
const linkByTarget=new Map();
function refreshNodes(){rowNodes=rowNodes.filter(r=>r.isConnected);linkNodes=linkNodes.filter(l=>l.isConnected);}
// [2026-10-26 PDT] Status popup: fixed, anchored above (else below) the triggering control, clamped to the
// viewport, pointer-events:none, auto-dismiss 1.2s. ok = accent fill; err = red. Replaces the in-flow #notice line.
function notice(t,anchor,kind,rect){
 const r=rect||(anchor&&anchor.isConnected?anchor.getBoundingClientRect():null);if(!r)return;
 const p=document.createElement('div');p.className='pop '+(kind||'ok');p.setAttribute('role','status');p.setAttribute('aria-live','polite');p.textContent=t;document.body.append(p);
 const w=p.offsetWidth,h=p.offsetHeight,vw=document.documentElement.clientWidth;
 let top=r.top-h-6;if(top<4)top=r.bottom+6;
 p.style.left=Math.max(4,Math.min(vw-w-4,r.left+r.width/2-w/2))+'px';p.style.top=top+'px';
 setTimeout(()=>p.remove(),1200);
}
const CHECK='<svg class="icon hi ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.75 6 6 9-13.5"/></svg>';
function flashCheck(btn){if(btn._icon===undefined)btn._icon=btn.innerHTML;btn.innerHTML=CHECK;btn.classList.add('copied');clearTimeout(btn._ck);btn._ck=setTimeout(()=>{btn.innerHTML=btn._icon;btn._icon=undefined;btn.classList.remove('copied');},900);}
function grab(r){return {cmd:r.dataset.copyPath||r.querySelector('.row-cmd').textContent,out:r.querySelector('.ln').textContent};}
function allCopyPaths(){const node=document.getElementById('all-copy-paths');if(!node)return rows().map(grab).map(g=>g.cmd);try{return JSON.parse(node.textContent);}catch(_){return rows().map(grab).map(g=>g.cmd);}}
async function writeClip(text,btn){
  try {
    try {await navigator.clipboard.writeText(text);} catch(_){
      const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();
      const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Clipboard unavailable');
    }
    flashCheck(btn);notice('Copied.',btn,'ok');
  } catch(e){notice('Copy failed. Select the output and copy manually.',btn,'err');}
}
function copyInput(b,e){const g=grab(b.closest('.row'));writeClip(e.shiftKey?g.cmd+'\n'+g.out:g.cmd,b);}
function copyOutput(b,e){const g=grab(b.closest('.row'));writeClip(e.shiftKey?g.cmd+'\n'+g.out:g.out,b);}
function copyAll(b,e,input){if(input&&!e.shiftKey){writeClip(allCopyPaths().join('\n'),b);return;}writeClip(rows().map(grab).map(g=>e.shiftKey?g.cmd+'\n'+g.out:g.out).join('\n\n'),b);}
let pending=[],pendingAnchor=null,pendingRect=null;
function deleteRows(items,anchor){if(!items.length)return;pending=items;pendingAnchor=anchor||null;pendingRect=anchor?anchor.getBoundingClientRect():null;document.getElementById('delete-question').textContent=`Delete ${items.length} entr${items.length===1?'y':'ies'} from this report? Source files are untouched.`;document.getElementById('delete-dialog').showModal();}
function deleteRow(b){deleteRows([b.closest('.row')],b);}
function syncFold(){const rs=rows(),all=rs.length>0&&rs.every(r=>r.classList.contains('collapsed'));
  rs.forEach(r=>{const b=r.querySelector('.btn-fold'),open=!r.classList.contains('collapsed');b.setAttribute('aria-expanded',open);b.title=open?'Collapse output':'Expand output';});
  const b=document.querySelector('.gfold');b.classList.toggle('collapsed',all);b.setAttribute('aria-expanded',!all);b.title=all?'Expand all outputs':'Collapse all outputs';

:root{--font-mono:'JBMono','JetBrainsMono Nerd Font Mono','JetBrains Mono'}
body,pre,code,input,button,textarea{font-family:var(--font-mono)}
body,pre,code,input,button{font-weight:300}
/* header: equal space above/below the bar, no hidden bottom border; date wraps under title */
header{padding:28px 0 20px!important;gap:20px!important;border-bottom:0!important}
.hdr-bar{margin-top:0!important}
@media(max-width:900px){header{padding:22px 0 18px!important;gap:18px!important}}
@media(max-width:560px){header{padding:18px 0 16px!important;gap:16px!important}}
/* one-row headers (no stats row): white pills and white pager so the header keeps contrast */
.hdr-deck:not(:has(.hdr-stats .kv)) .hdr-meta .kv{--pf:var(--paper)!important;--pi:var(--ink)!important}
header:not(:has(.hdr-stats .kv)) .hdr-bar .parts a{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--ink)!important}
header:not(:has(.hdr-stats .kv)) .hdr-bar .parts a.current,header:not(:has(.hdr-stats .kv)) .hdr-bar .parts a:hover{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--paper)!important}
/* dates: not bold */
.row-ts .ts-d{font-weight:300!important}
/* TOC: section labels tabbed in to the item text; +/- 20px stroke 3 */
aside .sec-hd{padding-left:14px!important}
.sec-hd .sec-fold,.sec-hd .sec-fold svg{width:20px!important;height:20px!important}
.sec-hd .sec-fold svg{stroke-width:3!important}
/* metadata headers: label follows the row colour (visible when focused) */
.meta-row .meta-hd .row-cmd{color:inherit!important}
.meta-row .meta-hd{cursor:pointer}
/* search: magnifying glass at text size, gone while typing */
.toc-search::placeholder{color:transparent!important}
.toc-search:placeholder-shown{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.25' stroke-linecap='round'><circle cx='10.5' cy='10.5' r='6.5'/><path d='M15.5 15.5l5 5'/></svg>") no-repeat 10px center/1.15em 1.15em}
/* no giant empty space at the bottom */
aside{height:auto!important;max-height:100vh!important;align-self:flex-start!important}
.resizer{height:auto!important;align-self:stretch!important}
section.content{padding-bottom:24px!important}
/* scroll thumb: the glowing cascading chevrons, translated to monochrome (smooth, layered depth) */
.scroll-thumb{animation:mb-glow 2.4s ease-in-out infinite!important}
.scroll-thumb i{width:10px!important;height:10px!important;margin-top:-3px!important;border-right:3px solid var(--ink)!important;border-bottom:3px solid var(--ink)!important;opacity:0;filter:none!important;animation:mb-chev 1.6s ease-in-out infinite!important}
.scroll-thumb i:first-child{margin-top:0!important}
.scroll-thumb i:nth-child(2){animation-delay:.2s!important}.scroll-thumb i:nth-child(3){animation-delay:.4s!important}
@keyframes mb-chev{0%{opacity:0;transform:translateY(-5px) rotate(45deg)}45%{opacity:1}100%{opacity:0;transform:translateY(6px) rotate(45deg)}}
@keyframes mb-glow{0%,100%{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 4px rgba(0,0,0,.55)) drop-shadow(0 2px 7px rgba(0,0,0,.35))}
 50%{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px rgba(0,0,0,.8)) drop-shadow(0 3px 12px rgba(0,0,0,.5))}}
@media(prefers-reduced-motion:reduce){.scroll-thumb,.scroll-thumb i{animation:none!important}.scroll-thumb i{opacity:1}}
.out{font-size:13px!important}</style>
