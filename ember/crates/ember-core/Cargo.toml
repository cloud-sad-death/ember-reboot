[package]
name = "ember-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "5"
memchr = "2"
parking_lot = "0.12"
portable-pty = "0.9"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
vt100 = "0.15"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
